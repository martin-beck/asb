[workspace]
members = ["crates/asb-cli"]
resolver = "3"

[workspace.package]
version = "0.2.51"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/martin-beck/asb"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
