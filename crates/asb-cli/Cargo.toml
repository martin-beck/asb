[package]
name = "asb-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[features]
# The exact-binary cross-repository qualification is intentionally opt-in;
# ordinary workspace coverage must not compile an external-process fixture.
cross-repo-qualification = []

[dependencies]
asb-agents = { version = "=0.1.0", path = "../asb-agents" }
asb-bundle = { version = "=0.1.0", path = "../asb-bundle" }
asb-analysis = { version = "=0.1.0", path = "../asb-analysis" }
asb-control = { version = "=0.1.0", path = "../asb-control" }
asb-config = { version = "=0.1.0", path = "../asb-config" }
asb-metrics = { version = "=0.1.0", path = "../asb-metrics" }
asb-orchestrator = { version = "=0.1.0", path = "../asb-orchestrator" }
asb-protocol = { version = "=0.1.0", path = "../asb-protocol" }
asb-replay = { version = "=0.1.0", path = "../asb-replay" }
asb-runtime = { version = "=0.1.0", path = "../asb-runtime" }
asb-store = { version = "=0.1.0", path = "../asb-store" }
asb-workloads = { version = "=0.1.0", path = "../asb-workloads" }
schemars = "=1.0.4"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.143"
sha2 = "=0.10.9"
signal-hook = "=0.3.18"
toml = "=1.1.6"
url = "=2.5.8"
unicode-width = "=0.2.2"
libc = "=0.2.189"
nix = { version = "=0.30.1", features = ["fs", "signal"] }
rustix = { version = "=1.1.4", features = ["fs", "process", "pty", "termios"] }
time = { version = "=0.3.55", features = ["formatting"] }

[dev-dependencies]
jsonschema = { version = "=0.33.0", default-features = false }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
syn = { version = "=3.0.6", features = ["full", "visit"] }
tempfile = "=3.27.0"

[[bin]]
name = "asb"
path = "src/main.rs"

[[example]]
name = "generate-capabilities-schema"
path = "examples/generate_capabilities_schema.rs"

[lints]
workspace = true
