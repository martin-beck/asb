[package]
name = "asb-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.143"
sha2 = "=0.10.9"
thiserror = "=2.0.20"

[dev-dependencies]
jsonschema = { version = "=0.33.0", default-features = false }

[lints]
workspace = true

[[example]]
name = "generate-schemas"
path = "examples/generate_schemas.rs"

[[example]]
name = "generate-measurement-fixtures"
path = "examples/generate_measurement_fixtures.rs"

[[bin]]
name = "asb-example-plugin"
path = "src/bin/asb_example_plugin.rs"
