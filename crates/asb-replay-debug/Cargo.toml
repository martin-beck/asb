[package]
name = "asb-replay-debug"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Offline terminal viewer for ASB replay mismatch evidence"

[dependencies]
asb-cli = { path = "../asb-cli" }
clap = { version = "=4.5.48", features = ["derive"] }
crossterm = "=0.28.1"
ratatui = "=0.29.0"
serde_json = "=1.0.143"
toml = "=1.1.6"
libc = "=0.2.190"

[dev-dependencies]
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
