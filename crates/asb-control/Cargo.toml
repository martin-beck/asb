[package]
name = "asb-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
asb-protocol = { version = "=0.1.0", path = "../asb-protocol" }
rustix = { version = "=1.1.4", features = ["event", "fs", "net", "process", "rand"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.143", features = ["raw_value"] }
sha2 = "=0.10.9"
thiserror = "=2.0.20"
x509-parser = { version = "=0.18.1", default-features = false }

[dev-dependencies]
jsonschema = { version = "=0.33.0", default-features = false }
rcgen = { version = "=0.14.7", default-features = false, features = ["aws_lc_rs", "pem"] }

[lints]
workspace = true

[[example]]
name = "generate-control-schema"
path = "examples/generate_schema.rs"

[[example]]
name = "generate-measurement-catalog-control-fixtures"
path = "examples/generate_measurement_catalog_fixtures.rs"
