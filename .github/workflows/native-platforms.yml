name: Hosted portability and native qualification
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel an exact-main post-merge run: its SHA is immutable evidence.
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
jobs:
  qualify:
    name: Platform evidence (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Install pinned native sandbox prerequisite
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          # Only these reviewed package revisions are permitted; repository state may not widen the pin.
          available=""
          for candidate in 0.9.0-1ubuntu0.2 0.9.0-1build1; do
            if apt-cache madison bubblewrap | awk '{print $3}' | grep -Fxq "$candidate"; then
              available="$candidate"
              break
            fi
          done
          test -n "$available" || { echo "ERROR: no reviewed bubblewrap package revision is available (allowed: 0.9.0-1ubuntu0.2, 0.9.0-1build1)" >&2; exit 1; }
          sudo apt-get install --yes --no-install-recommends "bubblewrap=$available"
          test "$(dpkg-query -W -f='${Version}' bubblewrap)" = "$available" || { echo "ERROR: installed bubblewrap version differs from reviewed allowlist pin" >&2; exit 1; }
      - name: Collect classified platform evidence
        id: evidence
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/asb-native-target
          HOSTED_EVIDENCE_FILE: ${{ runner.temp }}/hosted-portability-${{ matrix.runner }}.json
          NATIVE_EVIDENCE_FILE: ${{ runner.temp }}/native-qualification-${{ matrix.runner }}.json
          RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          ASB_HOSTED_PORTABILITY_DIAGNOSTICS: "1"
        run: |
          route="$(python3 tools/platforms/hosted_portability.py route --execution-class github-hosted)"
          case "$route" in
            native-qualification)
              python3 tools/platforms/native_evidence.py \
                --platform-id ubuntu-24.04 \
                --architecture "$(uname -m)" \
                --run-id "$RUN_ID" \
                --source "$GITHUB_WORKSPACE" \
                --base-commit "$BASE_COMMIT" \
                --output "$NATIVE_EVIDENCE_FILE" \
                --output-root "$RUNNER_TEMP" \
                --check 'process=["cargo","test","--locked","-p","asb-runtime","--test","process_boundary","--","--test-threads=1"]' \
                --check 'metrics=["cargo","test","--locked","-p","asb-metrics","--test","native_linux","--","--test-threads=1"]' \
                --check 'replay-authority=["env","ASB_REQUIRE_NATIVE_SANDBOX=1","cargo","test","--locked","-p","asb-runtime","local_bootstrap_positive_acquires_and_spawns_owned_authority","--lib"]' \
                --optional-check 'sandbox=["env","ASB_REQUIRE_NATIVE_SANDBOX=1","cargo","test","--locked","-p","asb-runtime","--test","sandbox_boundary","--","--test-threads=1"]'
              ;;
            hosted-portability)
              python3 tools/platforms/hosted_portability.py collect \
                --execution-class github-hosted \
                --runner-label ubuntu-24.04 \
                --architecture "$(uname -m)" \
                --run-id "$RUN_ID" \
                --source "$GITHUB_WORKSPACE" \
                --base-commit "$BASE_COMMIT" \
                --output "$HOSTED_EVIDENCE_FILE" \
                --output-root "$RUNNER_TEMP" \
                --check 'process=["cargo","test","--locked","-p","asb-runtime","--test","process_boundary","--","--test-threads=1"]' \
                --check 'metrics=["cargo","test","--locked","-p","asb-metrics","--test","native_linux","--","--test-threads=1"]' \
                --check 'sandbox=["env","ASB_REQUIRE_NATIVE_SANDBOX=1","cargo","test","--locked","-p","asb-runtime","--test","sandbox_boundary","--","--test-threads=1"]'
              ;;
            *)
              echo "ERROR: platform evidence route is invalid"
              exit 1
              ;;
          esac
          validated="$(python3 tools/platforms/hosted_portability.py validate-artifact \
            --route "$route" \
            --native-file "$NATIVE_EVIDENCE_FILE" \
            --hosted-file "$HOSTED_EVIDENCE_FILE" \
            --output-root "$RUNNER_TEMP" \
            --source "$GITHUB_WORKSPACE")"
          test "$validated" = "$route"
          echo "kind=$validated" >> "$GITHUB_OUTPUT"
      - name: Retain rolling-hosted portability evidence
        if: steps.evidence.outputs.kind == 'hosted-portability'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hosted-portability-${{ matrix.runner }}
          path: ${{ runner.temp }}/hosted-portability-${{ matrix.runner }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain exact native qualification evidence
        if: steps.evidence.outputs.kind == 'native-qualification'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-qualification-${{ matrix.runner }}
          path: ${{ runner.temp }}/native-qualification-${{ matrix.runner }}.json
          if-no-files-found: error
          retention-days: 30
