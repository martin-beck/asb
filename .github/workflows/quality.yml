name: Repository quality
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel an exact-main post-merge run: its SHA is immutable evidence.
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
jobs:
  quality:
    name: Policy, coverage, and supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component llvm-tools-preview
      - name: Install pinned Rust quality tools
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-llvm-cov@0.9.0
      - name: Install digest-pinned repository analyzers
        run: |
          bin_dir="$(tools/quality/install-external-tools.sh)"
          printf 'ASB_QUALITY_BIN=%s\n' "$bin_dir" >> "$GITHUB_ENV"
      - name: Determine introduced commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          head="${GITHUB_SHA}"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          elif [[ "$PUSH_BASE" =~ ^[0-9a-f]{40}$ ]] &&
               [[ "$PUSH_BASE" != 0000000000000000000000000000000000000000 ]]; then
            base="$PUSH_BASE"
          else
            base="$(git rev-list --max-parents=0 HEAD)"
            if [[ "$base" == "${GITHUB_SHA}" ]]; then
              base=
            fi
          fi
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
          printf 'head=%s\n' "$head" >> "$GITHUB_OUTPUT"
      - name: Enforce repository and commit policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RANGE_HEAD: ${{ steps.range.outputs.head }}
        run: |
          mode=ssh-only
          if [[ "$EVENT_NAME" == push && "$EVENT_REF" == refs/heads/main ]]; then
            mode=protected-main
          fi
          args=(--head "$RANGE_HEAD" --mode "$mode" --event "$EVENT_NAME" --ref "$EVENT_REF")
          if [[ -n "$RANGE_BASE" ]]; then
            args+=(--base "$RANGE_BASE")
          fi
          python3 tools/quality/repository_policy.py "${args[@]}"
      - name: Enforce canonical contract consistency
        env:
          RANGE_BASE: ${{ steps.range.outputs.base }}
        run: |
          python3 -m unittest tools.quality.test_contract_consistency
          args=(--run-tests)
          if [[ -n "$RANGE_BASE" ]]; then
            args+=(--baseline-ref "$RANGE_BASE")
          fi
          python3 tools/quality/contract_consistency.py "${args[@]}"
      - name: Validate offline tutorial contracts
        run: |
          python3 -m unittest tools.tutorials.test_validate
          python3 -m unittest tools.tutorials.test_freshness
          python3 tools/tutorials/check_freshness.py
      - name: Validate GitHub workflows
        run: |
          test -x "$ASB_QUALITY_BIN/shellcheck"
          "$ASB_QUALITY_BIN/shellcheck" --version | grep -F "version: 0.11.0"
          "$ASB_QUALITY_BIN/actionlint" -config-file .github/actionlint.yaml -shellcheck "$ASB_QUALITY_BIN/shellcheck"
          "$ASB_QUALITY_BIN/zizmor" --pedantic .
      - name: Scan complete introduced history for secrets
        env:
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RANGE_HEAD: ${{ steps.range.outputs.head }}
        run: |
          args=(--gitleaks "$ASB_QUALITY_BIN/gitleaks" --config .gitleaks.toml --head "$RANGE_HEAD" --repo .)
          if [[ -n "$RANGE_BASE" ]]; then
            args+=(--base "$RANGE_BASE")
          fi
          tools/quality/run_gitleaks.sh "${args[@]}"
      - name: Check dependency policy and advisories
        run: |
          cargo deny --locked check
          cargo audit --deny warnings
      - name: Enforce coverage floors
        run: python3 tools/quality/check_coverage.py
      - name: Prove gates reject controlled defects
        run: |
          python3 tools/quality/test_failure_paths.py --bin-dir "$ASB_QUALITY_BIN"
          python3 -m unittest tools.quality.test_signature_policy
          python3 tests/quality/test_artifact_outcome.py
      - name: Enforce human diagnostic completeness
        run: |
          cargo test --locked -p asb-cli --test diagnostic_contract
          cargo test --locked -p asb-cli --test diagnostic_journey
          cargo test --locked -p asb-cli every_public_command_has_a_human_safe_invalid_argument_journey
          cargo test --locked -p asb-cli --test human_cli ar1769_executable_diagnostic_matrix_covers_public_failure_boundaries
      - name: Validate platform manifests and failure fixtures
        run: |
          python3 tools/platforms/validate_manifests.py
          python3 -m unittest discover -s tests/platforms -p "test_*.py"
      - name: Verify clean tree
        run: git diff --exit-code
      - name: Prepare bounded optional quality evidence
        env:
          EVIDENCE_HEAD: ${{ steps.range.outputs.head }}
        run: |
          python3 tools/quality/artifact_outcome.py prepare \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF" \
            --head "$EVIDENCE_HEAD" \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --output-root "$RUNNER_TEMP" \
            --output "$RUNNER_TEMP/asb-quality-evidence.json"
      - name: Publish optional quality evidence
        id: optional_evidence_upload
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/asb-quality-evidence.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Classify optional evidence publication
        if: ${{ !cancelled() }}
        env:
          ARTIFACT_OUTCOME: ${{ steps.optional_evidence_upload.outcome }}
        run: |
          python3 tools/quality/artifact_outcome.py classify \
            --role optional \
            --outcome "$ARTIFACT_OUTCOME" \
            --attempt "$GITHUB_RUN_ATTEMPT"
