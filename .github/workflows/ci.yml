name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked
      - name: Check Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test checkout updates
        run: python3 scripts/test_update_checkout.py
      - name: Build
        run: cargo build --locked
      - name: Remove test-generated workspace files
        run: rm -f crates/asb-cli/.asb/install.log
      - name: Verify package
        run: cargo package --locked
      - name: Verify packaged runtime assets
        shell: bash
        run: |
          set -euo pipefail
          package=$(find target/package -maxdepth 1 -type f -name 'asb-cli-*.crate' -print | sort -V | tail -n1)
          test -n "$package"
          archive=$(tar -tf "$package")
          for asset in \
            src/agents/adapters/openjiuwen/usage_compat.py \
            assets/scripts/cli2key-proxy.mjs \
            assets/scripts/llmtape.mjs \
            assets/scripts/network-fetch.mjs \
            assets/workloads/bug-fix.txt \
            assets/workloads/fixtures/bug-fix/src/parser.py; do
            printf '%s\n' "$archive" | grep -Fq "/$asset"
          done
      - name: Test packaged crate
        shell: bash
        run: |
          set -euo pipefail
          package=$(find target/package -maxdepth 1 -type f -name 'asb-cli-*.crate' -print | sort -V | tail -n1)
          test -n "$package"
          unpacked=$(mktemp -d)
          trap 'rm -rf "$unpacked"' EXIT
          tar -xzf "$package" -C "$unpacked"
          manifest=$(find "$unpacked" -mindepth 2 -maxdepth 2 -name Cargo.toml -print -quit)
          test -n "$manifest"
          cargo test --locked --manifest-path "$manifest"
      - name: Install and smoke-test packaged crate
        shell: bash
        run: |
          set -euo pipefail
          package=$(find target/package -maxdepth 1 -type f -name 'asb-cli-*.crate' -print | sort -V | tail -n1)
          test -n "$package"
          unpacked=$(mktemp -d)
          install_root=$(mktemp -d)
          trap 'rm -rf "$unpacked" "$install_root"' EXIT
          tar -xzf "$package" -C "$unpacked"
          manifest=$(find "$unpacked" -mindepth 2 -maxdepth 2 -name Cargo.toml -print -quit)
          test -n "$manifest"
          cargo install --locked --path "$(dirname "$manifest")" --root "$install_root"
          "$install_root/bin/asb" --help

  local-host-checks:
    # This is disabled until the repository owner provisions an appropriately
    # isolated runner and explicitly enables the repository variable.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.ASB_LOCAL_CI_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, asb-local-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use the runner's Rust toolchain
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Check Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked
      - name: Test checkout updates
        run: python3 scripts/test_update_checkout.py
      - name: Build
        run: cargo build --locked
      - name: Remove test-generated workspace files
        run: rm -f crates/asb-cli/.asb/install.log
      - name: Verify package
        run: cargo package --locked
      - name: Test packaged crate
        shell: bash
        run: |
          set -euo pipefail
          package=$(find target/package -maxdepth 1 -type f -name 'asb-cli-*.crate' -print | sort -V | tail -n1)
          test -n "$package"
          unpacked=$(mktemp -d)
          trap 'rm -rf "$unpacked"' EXIT
          tar -xzf "$package" -C "$unpacked"
          manifest=$(find "$unpacked" -mindepth 2 -maxdepth 2 -name Cargo.toml -print -quit)
          test -n "$manifest"
          cargo test --locked --manifest-path "$manifest"
      - name: Install and smoke-test packaged crate
        shell: bash
        run: |
          set -euo pipefail
          package=$(find target/package -maxdepth 1 -type f -name 'asb-cli-*.crate' -print | sort -V | tail -n1)
          test -n "$package"
          unpacked=$(mktemp -d)
          install_root=$(mktemp -d)
          trap 'rm -rf "$unpacked" "$install_root"' EXIT
          tar -xzf "$package" -C "$unpacked"
          manifest=$(find "$unpacked" -mindepth 2 -maxdepth 2 -name Cargo.toml -print -quit)
          test -n "$manifest"
          cargo install --locked --path "$(dirname "$manifest")" --root "$install_root"
          "$install_root/bin/asb" --help
