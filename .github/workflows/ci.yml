name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Persistent native runners must not accumulate incremental compiler state
  # across revisions. CI validates clean artifacts, not incremental reuse.
  CARGO_INCREMENTAL: '0'

jobs:
  checks:
    # `asb-main-ci` is assigned only to the provisioned ASB runner, so an
    # unrelated generic self-hosted runner cannot claim this toolchain gate.
    runs-on: [self-hosted, Linux, X64, asb-main-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          # The selector compares the PR's immutable base and head commits.
          fetch-depth: 0
      - name: Prepare runner fixture directory
        # Rust's test fixtures use std::env::temp_dir(). Keep them on the
        # provisioned runner volume rather than the host's shared /tmp, whose
        # capacity is deliberately not an ASB test prerequisite.
        run: |
          mkdir -p "$RUNNER_TEMP/asb-fixtures"
          echo "TMPDIR=$RUNNER_TEMP/asb-fixtures" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The dedicated runner provisions the supported host Python. Do not
      # prepend Actions' toolcache interpreter: native gate fixtures execute
      # the host toolchain and must retain its matching runtime libraries.
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --locked
      - name: Verify pull-request test selection
        if: github.event_name == 'pull_request'
        run: python3 scripts/test_ci_pr_tests.py
      - name: Run changed-component tests
        if: github.event_name == 'pull_request'
        env:
          ASB_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ASB_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_pr_tests.py --base "$ASB_CI_BASE_SHA" --head "$ASB_CI_HEAD_SHA"
      - name: Run full post-merge test suite
        if: github.event_name != 'pull_request'
        # The suite owns real process trees and filesystem fixtures. Main keeps
        # the complete serial gate; PRs exercise only their owning component.
        run: cargo test --locked -- --test-threads=1
      - name: Check Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test checkout updates
        run: python3 scripts/test_update_checkout.py
      - name: Remove test-generated workspace files
        run: rm -f crates/asb-cli/.asb/install.log

  local-host-checks:
    # This is disabled until the repository owner provisions an appropriately
    # isolated runner and explicitly enables the repository variable.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.ASB_LOCAL_CI_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, asb-local-ci]
    # Serial execution preserves isolation for real host fixtures; allow the
    # complete suite to finish rather than cancelling it at the old parallel
    # suite budget.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare runner fixture directory
        # Keep fixture-heavy serial tests off the shared host /tmp filesystem.
        run: |
          mkdir -p "$RUNNER_TEMP/asb-fixtures"
          echo "TMPDIR=$RUNNER_TEMP/asb-fixtures" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use the runner's Rust toolchain
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Verify the existing offline Python prerequisite
        shell: bash
        run: |
          set -euo pipefail
          for asb_python in python3.12 python3.13; do
            if command -v "$asb_python" >/dev/null && timeout 10s "$asb_python" -I -S -c 'import sys, venv; assert sys.version_info[:2] in [(3, 12), (3, 13)]; print(sys.version.split()[0])'; then
              exit 0
            fi
          done
          echo 'Offline tests require an existing Python 3.12 or 3.13 with venv on PATH; provision it outside this hardened runner job.' >&2
          exit 1
      - name: Check Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --locked
      - name: Run tests
        # This runner exercises the same real process trees and shared
        # filesystem fixtures as `checks`; retain all coverage while avoiding
        # overlapping fixture lifecycles on one host.
        run: cargo test --locked -- --test-threads=1
      - name: Test checkout updates
        run: python3 scripts/test_update_checkout.py
      - name: Remove test-generated workspace files
        run: rm -f crates/asb-cli/.asb/install.log
